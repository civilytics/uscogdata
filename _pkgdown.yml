url: https://civilytics.r-universe.dev/uscogdata

template:
  bootstrap: 5

reference:
  - title: Financial data
    desc: Spending, revenue and balance-sheet holdings for one or more governments.
    contents:
      - cog_spending
      - cog_revenue
      - cog_balances
  - title: Search & basket
    desc: Resolve place names into canonical govids.
    contents:
      - cog_gov_search
      - cog_basket_resolution
      - cog_basket_unresolved
  - title: Comparison & aggregation
    desc: Peer cohorts and geographic aggregates.
    contents:
      - cog_find_peers
      - cog_peer_compare
      - cog_geographic_rollup
  - title: Corpus metadata
    desc: >
      What the corpus contains, where a given result came from, and how to
      hold a local copy of it.
    contents:
      - cog_categories
      - cog_recipes
      - cog_manifest
      - cog_explain
      - cog_mirror

articles:
  - title: Concepts
    navbar: ~
    contents:
      - total-spending
      - population-denominators
